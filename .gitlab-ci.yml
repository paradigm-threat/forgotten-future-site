# GitLab Pages — Next.js static export (out/ → public/ for Pages artifact).
# Mirrors .github/workflows/nextjs.yml; base path matches project Pages URL segment.
# Set the project default branch in GitLab to master if that is your primary branch.
# Pages URL: https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}/

image: node:20-bookworm

variables:
  NEXT_PUBLIC_IS_STATIC: "true"
  NEXT_PUBLIC_BASE_PATH: "/$CI_PROJECT_NAME"
  # Cross-project Pages URLs (hash subdomains). Override in GitLab CI/CD variables if they change.
  FF_STORY_PAGES_URL: "https://ff-story-6a84a5.gitlab.io"
  FF_TEASER_PAGES_URL: "https://ff-teaser-12140e.gitlab.io"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  stage: deploy
  script:
    - export NEXT_PUBLIC_SITE_URL="https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
    - export NEXT_PUBLIC_STORY_RAW_BASE="$FF_STORY_PAGES_URL"
    - export NEXT_PUBLIC_TEASER_RAW_BASE="$FF_TEASER_PAGES_URL"
    - export NEXT_PUBLIC_API_BASE="$NEXT_PUBLIC_SITE_URL"
    - npm ci --cache .npm --prefer-offline
    - rm -rf app/api public/story
    - npm run build
    - rm -rf public && mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_NAME == "test"
